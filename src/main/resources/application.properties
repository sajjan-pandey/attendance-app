spring.application.name=attendance
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/attendance_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:attendance_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_POOL_SIZE:10}

# POC only: Hibernate creates the schema when the application starts.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
logging.level.com.attendance=INFO

# Calibrate these values against the deployed camera population before production use.
face.recognition.distance-threshold=${FACE_RECOGNITION_DISTANCE_THRESHOLD:0.60}
face.recognition.min-best-match-margin=${FACE_RECOGNITION_MIN_BEST_MATCH_MARGIN:0.05}
